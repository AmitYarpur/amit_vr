<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bouncing Colors VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body style="margin:0;overflow:hidden;">

  <a-scene background="color:#0a0a1a">

    <a-assets>
      <a-mixin id="bouncer"
        animation__bounce="property: position; dir: alternate; dur: 1400; easing: easeInOutSine; loop: true"
        animation__spin="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
      </a-mixin>
    </a-assets>

    <!-- Ambient + point light so colors read well -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="point" position="0 4 0" intensity="0.8" color="#ffffff"></a-light>

    <!-- Bouncing colorful shapes surrounding the viewer -->
    <a-sphere mixin="bouncer" color="#ff3b6b" radius="0.4"
      position="-3 1 -3" animation__bounce="property: position; to: -3 2.2 -3; dir: alternate; dur: 1100; easing: easeInOutSine; loop: true">
    </a-sphere>

    <a-box mixin="bouncer" color="#3ba7ff" width="0.6" height="0.6" depth="0.6"
      position="3 1.5 -3" animation__bounce="property: position; to: 3 2.8 -3; dir: alternate; dur: 1500; easing: easeInOutSine; loop: true">
    </a-box>

    <a-cylinder mixin="bouncer" color="#ffd23b" radius="0.35" height="0.7"
      position="0 1 -4" animation__bounce="property: position; to: 0 2.5 -4; dir: alternate; dur: 1300; easing: easeInOutSine; loop: true">
    </a-cylinder>

    <a-octahedron mixin="bouncer" color="#3bffa0" radius="0.5"
      position="-2 1.2 -1.5" animation__bounce="property: position; to: -2 2.6 -1.5; dir: alternate; dur: 1700; easing: easeInOutSine; loop: true">
    </a-octahedron>

    <a-dodecahedron mixin="bouncer" color="#b23bff" radius="0.45"
      position="2 1.3 -1.5" animation__bounce="property: position; to: 2 2.7 -1.5; dir: alternate; dur: 1250; easing: easeInOutSine; loop: true">
    </a-dodecahedron>

    <a-torus mixin="bouncer" color="#ff8a3b" radius="0.4" radius-tubular="0.08"
      position="0 1.4 2" animation__bounce="property: position; to: 0 2.9 2; dir: alternate; dur: 1600; easing: easeInOutSine; loop: true">
    </a-torus>

    <a-sphere mixin="bouncer" color="#ff3bd8" radius="0.3"
      position="-4 1 0" animation__bounce="property: position; to: -4 2.4 0; dir: alternate; dur: 1000; easing: easeInOutSine; loop: true">
    </a-sphere>

    <a-box mixin="bouncer" color="#3bffe0" width="0.5" height="0.5" depth="0.5"
      position="4 1 0" animation__bounce="property: position; to: 4 2.3 0; dir: alternate; dur: 1450; easing: easeInOutSine; loop: true">
    </a-box>

    <!-- Ground -->
    <a-plane rotation="-90 0 0" width="30" height="30" color="#141428"></a-plane>

    <!-- Camera rig: works for both flat browser and Quest headset/controllers -->
    <a-entity id="rig" position="0 0 3">
      <a-camera look-controls wasd-controls></a-camera>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

  </a-scene>

  <a href="index.html" style="
      position:fixed; top:12px; left:12px; z-index:1000;
      background:rgba(0,0,0,0.5); color:#fff; padding:8px 14px;
      border-radius:6px; font-family:sans-serif; text-decoration:none; font-size:14px;">
    &larr; Back
  </a>

</body>
</html>
