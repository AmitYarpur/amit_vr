<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amit VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a0a1a;
      font-family: system-ui, sans-serif;
      color: #fff;
      padding: 32px 16px 64px;
    }
    h1 {
      text-align: center;
      font-weight: 600;
      font-size: clamp(22px, 4vw, 32px);
      margin: 0 0 8px;
    }
    p.sub {
      text-align: center;
      color: #9a9ac0;
      margin: 0 0 36px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #141428;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a4a;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      border-color: #5a5aff;
    }
    .card .thumb {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      background: #0a0a1a;
      display: block;
    }
    .card .label {
      padding: 10px 12px;
      font-size: 13px;
      color: #d0d0f0;
      word-break: break-all;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Amit VR</h1>
  <p class="sub">Pick a scene to enter</p>

  <div class="grid">

    <a class="card" href="video360.html?src=3d_screwdriver.mp4&amp;title=3d_screwdriver.mp4">
      <img class="thumb" src="thumbs/3d_screwdriver.jpg" alt="3d_screwdriver.mp4 preview">
      <div class="label">3d_screwdriver.mp4</div>
    </a>

    <a class="card" href="stereo.html?src=3d_screwdriver.mp4&amp;title=3d_screwdriver.mp4 (3D stereo)&amp;swap=true">
      <img class="thumb" src="thumbs/3d_screwdriver.jpg" alt="3d_screwdriver.mp4 3D stereo preview">
      <div class="label">3d_screwdriver.mp4 (3D stereo)</div>
    </a>

    <a class="card" href="video360.html?src=clidoscope.mp4&amp;title=clidoscope.mp4">
      <img class="thumb" src="thumbs/clidoscope.jpg" alt="clidoscope.mp4 preview">
      <div class="label">clidoscope.mp4</div>
    </a>

    <a class="card" href="video360.html?src=colors_stairs.mp4&amp;title=colors_stairs.mp4 (360)">
      <img class="thumb" src="thumbs/colors_stairs.jpg" alt="colors_stairs.mp4 360 preview">
      <div class="label">colors_stairs.mp4 (360)</div>
    </a>

    <a class="card" href="cinema.html?src=colors_stairs.mp4&amp;title=colors_stairs.mp4 (cinema)">
      <img class="thumb" src="thumbs/colors_stairs.jpg" alt="colors_stairs.mp4 cinema preview">
      <div class="label">colors_stairs.mp4 (cinema)</div>
    </a>

    <a class="card" href="stereo.html?src=colors_stairs_3d.mp4&amp;title=colors_stairs.mp4 (3D stereo)">
      <img class="thumb" src="thumbs/colors_stairs.jpg" alt="colors_stairs.mp4 3D stereo preview">
      <div class="label">colors_stairs.mp4 (3D stereo)</div>
    </a>

    <a class="card" href="boxes.html">
      <img class="thumb" src="thumbs/boxes.svg" alt="bouncing_boxes preview">
      <div class="label">bouncing_boxes</div>
    </a>

  </div>

</body>
</html>
