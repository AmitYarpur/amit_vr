<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Stereo VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-stereo-component@master/dist/aframe-stereo-component.min.js"></script>
</head>
<body style="margin:0;overflow:hidden;">

  <a-scene background="color:#000">

    <a-assets>
      <video id="vidsrc" src="colors_stairs_3d.mp4" loop webkit-playsinline playsinline preload="auto"></video>
    </a-assets>

    <a-light type="ambient" color="#ffffff" intensity="0.3"></a-light>

    <!-- Left-eye and right-eye screens: same size/position, each sampling
         its half of the side-by-side stereo video via the stereo component -->
    <a-entity
      geometry="primitive: plane; width: 2.25; height: 4"
      material="shader: flat; src: #vidsrc"
      position="0 2.1 -4"
      stereo="eye: left">
    </a-entity>

    <a-entity
      geometry="primitive: plane; width: 2.25; height: 4"
      material="shader: flat; src: #vidsrc"
      position="0 2.1 -4"
      stereo="eye: right">
    </a-entity>

    <a-plane rotation="-90 0 0" width="30" height="30" color="#0d0d18"></a-plane>

    <a-entity id="rig" position="0 0 0">
      <a-camera look-controls wasd-controls stereocam="eye: left;"></a-camera>
      <a-entity id="rightHand" meta-touch-controls="hand: right"></a-entity>
    </a-entity>

  </a-scene>

  <!-- Play overlay: browsers block autoplay-with-sound until a user gesture -->
  <div id="playOverlay" style="
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.75); z-index:999; cursor:pointer; font-family:sans-serif;">
    <div style="text-align:center; color:#fff;">
      <div style="font-size:64px;">&#9658;</div>
      <div style="font-size:20px; margin-top:10px;">Tap to play colors_stairs.mp4 (3D stereo)</div>
    </div>
  </div>

  <a href="index.html" style="
      position:fixed; top:12px; left:12px; z-index:1000;
      background:rgba(0,0,0,0.5); color:#fff; padding:8px 14px;
      border-radius:6px; font-family:sans-serif; text-decoration:none; font-size:14px;">
    &larr; Back
  </a>

  <script>
    const vid = document.getElementById('vidsrc');
    const overlay = document.getElementById('playOverlay');
    overlay.addEventListener('click', () => {
      vid.play();
      overlay.style.display = 'none';
    });

    // A or B on the right Touch controller: stop and return to the landing page
    const rightHand = document.getElementById('rightHand');
    function backToLanding() {
      vid.pause();
      window.location.href = 'index.html';
    }
    rightHand.addEventListener('abuttondown', backToLanding);
    rightHand.addEventListener('bbuttondown', backToLanding);
  </script>

</body>
</html>
